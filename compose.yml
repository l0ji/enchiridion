name: enchiridion

services:
  enchiridion:
    image: ${ENCHIRIDION_IMAGE:-enchiridion:0.1.0}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: enchiridion
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command:
      - serve
      - --channel
      - http
      - --bind
      - 0.0.0.0
      - --port
      - "8787"
    ports:
      - "${ENCHIRIDION_PORT:-8787}:8787"
    tmpfs:
      - /run/secrets:mode=0700
    volumes:
      - enchiridion-state:/var/lib/enchiridion
      - ./config.cl:/opt/enchiridion/config.cl:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - SYS_ADMIN
    environment:
      ENCHIRIDION_REQUIRE_HIDEPID: "1"

volumes:
  enchiridion-state:
